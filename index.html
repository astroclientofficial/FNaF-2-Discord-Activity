<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clickteam Fusion Game</title>
</head>
<body>
  <canvas id="MMFCanvas" width="1024" height="768">
    <p>Your browser does not support Canvas.</p>
  </canvas>
  <script src="src/Runtime.js"></script>
  <script>
    // Start the Clickteam Fusion runtime when the page loads.
    window.addEventListener("load", function () {
      // The first parameter is the ID of the canvas element.
      // The second parameter is the path to the CCH file containing the game data.
      new Runtime("MMFCanvas", "resources/Five Nights At Freddy's 2 Web Edition.cch");
    }, false);
  </script>
</body>
</html>
